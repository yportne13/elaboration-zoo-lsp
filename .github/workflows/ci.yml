name: Build and Deploy

on:
  push:
    branches:
      - master

# Serialize runs on the same ref so a superseded push waits instead of kicking
# off a second full 22-bin compile in parallel.  cancel-in-progress stays false:
# this workflow publishes GitHub Releases, and cancelling a run mid-flight could
# leave a created tag without its assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: L13 gate (lib + parity + twin LSP)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      # Shared key with the `test-full` job so whichever runs second restores
      # the other's compiled `target/` instead of recompiling from cold.  Both
      # jobs previously used disjoint, job-prefixed keys, which forced two full
      # cold compiles of the same dependency graph on every push.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run the L13 gate
        run: bash tools/gate_l13.sh

      # The gate only builds `--lib` + two `--test` targets, so it cannot see a
      # stray target that cargo auto-discovers.  That is not hypothetical: a
      # scratch probe left at `examples/b1_probe.rs` (needs `--features sampler`)
      # was committed on 2026-09-23 and broke `cargo test` / `cargo build` while
      # the gate stayed green.  `--examples --tests` is the cheap guard for it.
      - name: Check every example and test target builds
        run: cargo check --examples --tests

  # Full-suite job: the L13 gate only exercises --lib + l13_fast_parity +
  # twin_engine_tests, and the check above never *runs* anything.  Of the
  # repo's 66 test targets (~50 integration tests for parser/HDL/emit/L02-L12
  # plus non-L13 unit tests) none executed on CI before this job.
  test-full:
    name: Full test suite (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      # Same key/restore as the `test` job — see the note there.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run the full test suite
        run: cargo test --no-fail-fast

  dependencies:
    name: Build dependencies
    runs-on: ubuntu-latest
    # Only tag/release once the gate is green.
    needs: test
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create global variables
        id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  # The three artifact jobs build first and only publish workflow artifacts;
  # `release` (below) creates the GitHub release once they all succeed, so a
  # failed build can no longer strand a published tag with no assets.
  build-vscode:
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Rust wasm toolchain IS required here: `vsce package` runs
      # `vscode:prepublish` → `npm run build`, which cross-compiles the LSP to
      # wasm32-wasip1-threads and drops it at client/server.wasm.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          target: wasm32-wasip1-threads

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
            ${{ runner.os }}-cargo-

      - name: Build VS Code extension
        run: |
          cd vscode_extension/
          npm install
          npm install -g vsce
          vsce package

      - name: Read extension version from package.json
        id: ext_version
        run: echo "version=$(node -p "require('./vscode_extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: TyportHDL-${{ steps.ext_version.outputs.version }}
          path: |
            vscode_extension/*.vsix

  build-cli:
    name: Build CLI (Linux + Windows)
    runs-on: ubuntu-latest
    needs: dependencies
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip1-threads, x86_64-unknown-linux-musl, x86_64-pc-windows-gnu

      # These are full LTO release builds (see [profile.release] in Cargo.toml);
      # without a cache every push re-downloads crates and rebuilds from cold.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cli-
            ${{ runner.os }}-cargo-

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-mingw-w64-x86-64

      - name: Build typort (x86_64-unknown-linux-musl)
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bin typort
          cp target/x86_64-unknown-linux-musl/release/typort target/typort-x86_64-linux-musl

      - name: Build typort (x86_64-pc-windows-gnu)
        run: |
          cargo build --release --target x86_64-pc-windows-gnu --bin typort
          cp target/x86_64-pc-windows-gnu/release/typort.exe target/typort-x86_64-windows.exe

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: typort-cli
          path: |
            target/typort-x86_64-linux-musl
            target/typort-x86_64-windows.exe

  build-cli-macos:
    name: Build CLI (macOS ARM)
    runs-on: macos-latest
    needs: dependencies
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-macos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-
            ${{ runner.os }}-cargo-

      - name: Build typort (aarch64-apple-darwin)
        run: |
          cargo build --release --target aarch64-apple-darwin --bin typort
          cp target/aarch64-apple-darwin/release/typort target/typort-aarch64-macos

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: typort-cli-macos
          path: target/typort-aarch64-macos

  release:
    name: "Create Github tag/pre-release"
    runs-on: ubuntu-latest
    needs: [dependencies, build-vscode, build-cli, build-cli-macos]
    timeout-minutes: 15
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Github pre-release (${{ needs.dependencies.outputs.version }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}-${{ needs.dependencies.outputs.version }}
          name: Version ${{ github.run_number }} (${{ needs.dependencies.outputs.version }})
          prerelease: false
          files: artifacts/**/*
