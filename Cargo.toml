[package]
name = "elaboration-zoo-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "elaboration-zoo-lsp"
path = "src/main.rs"

[[bin]]
name = "typort"
path = "src/bin/cli.rs"



[dependencies]
lsp-types = { version = "0.95.1", features = ["proposed"] }
lsp-server = "0.7.6"
walkdir = "2"
serde = "1.0.189"
serde_json = "1.0.107"
oxc_index = "0.36.0"
chumsky = "0.9.3"
rust-lapper = "1.1.0"
thiserror = "2.0.3"
ropey = "1.5.0"

log = "0.4.14"
colored = "2.1.0"
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
smol_str = "0.3.2"
codespan-reporting = "0.13.1"
clap = { version = "4", features = ["derive"] }
dhat = { version = "0.3", optional = true }
backtrace = { version = "0.3", optional = true }
inferno = { version = "0.12", optional = true }
mimalloc = "0.1.52"
rustc-hash = "2.1.3"

[features]
dhat-heap = ["mem-profile"]
mem-profile = ["dep:dhat"]
stdio-monitor = []
sampler = ["dep:backtrace", "dep:inferno"]

# The lib tests elaborate the prelude on every test thread (the prelude
# cache is thread-local since the Arc->Rc migration).  Unoptimized debug
# elaboration makes that cost dominate the suite; opt-level=1 (the
# rust-analyzer approach) keeps the suite fast.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
# strip = true  # enabled for releases, disabled via release-profiling for profiling

[profile.release-profiling]
inherits = "release"
debug = 2
