[package]
name = "elaboration-zoo-lsp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "elaboration-zoo-lsp"
path = "src/main.rs"

[[bin]]
name = "typort"
path = "src/bin/cli.rs"

[[bin]]
name = "l01bench"
path = "src/bin/l01bench.rs"

[[bin]]
name = "l02bench"
path = "src/bin/l02bench.rs"

[[bin]]
name = "l03bench"
path = "src/bin/l03bench.rs"

[[bin]]
name = "l04bench"
path = "src/bin/l04bench.rs"

[[bin]]
name = "l05bench"
path = "src/bin/l05bench.rs"

[[bin]]
name = "l06bench"
path = "src/bin/l06bench.rs"

[[bin]]
name = "l07bench"
path = "src/bin/l07bench.rs"

[[bin]]
name = "l08bench"
path = "src/bin/l08bench.rs"

[[bin]]
name = "l09bench"
path = "src/bin/l09bench.rs"

[[bin]]
name = "l10bench"
path = "src/bin/l10bench.rs"

[[bin]]
name = "l11bench"
path = "src/bin/l11bench.rs"

[[bin]]
name = "l12bench"
path = "src/bin/l12bench.rs"

[[bin]]
name = "l13bench"
path = "src/bin/l13bench.rs"

# Tool bins: 通过 #[path] 直接编译多层源码（含各自的 #[cfg(test)] 模块），
# 其测试目标会跑重复的文件 IO 测试并互相覆盖固定路径——关掉 test 目标。
#
# `pmabbench` 同样是多层 `#[path]` 编译（L07 + bench_pre/L07 + L09），此前靠
# bin 自动发现、没进这张名单，于是 L07 与 L07_pre 两份 `test_file_io_builtins`
# 在同一测试二进制里并行读写/删除同一个固定路径 `l07_test_io.txt`，Windows 上
# 删一个仍被另一个打开的文件即 `os error 5`（2026-09-22 全量 cargo test 命中）。
[[bin]]
name = "pmabbench"
path = "src/bin/pmabbench.rs"
test = false

[[bin]]
name = "l07alloc"
path = "src/bin/l07alloc.rs"
test = false

[[bin]]
name = "l07whoalloc"
path = "src/bin/l07whoalloc.rs"
test = false

[[bin]]
name = "l11repro"
path = "src/bin/l11repro.rs"
test = false

# 内存分析工具：L02–L05 性能版分配计数/字节/直方图（确定性口径，l07alloc 同族）
[[bin]]
name = "l02l05mem"
path = "src/bin/l02l05mem.rs"
test = false

# 内存分析工具：L06–L13 性能版分配计数/字节/直方图（l02l05mem 的姊妹）
[[bin]]
name = "l06l13mem"
path = "src/bin/l06l13mem.rs"
test = false



[dependencies]
lsp-types = { version = "0.95.1", features = ["proposed"] }
lsp-server = "0.7.6"
walkdir = "2"
serde = { version = "1.0.189", features = ["derive"] }
serde_json = "1.0.107"
toml = "0.8"
oxc_index = "0.36.0"
chumsky = "0.9.3"
rust-lapper = "1.1.0"
thiserror = "2.0.3"
ropey = "1.5.0"
bumpalo = "3"

log = "0.4.14"
colored = "2.1.0"
crossbeam-channel = "0.5.15"
dashmap = "6.1.0"
smol_str = "0.3.2"
codespan-reporting = "0.13.1"
clap = { version = "4", features = ["derive"] }
dhat = { version = "0.3", optional = true }
backtrace = { version = "0.3", optional = true }
inferno = { version = "0.12", optional = true }
rustc-hash = "2.1.3"

# mimalloc is a C library; cross-building it for wasm needs WASI clang, so
# restrict it to native targets (the vscode web extension builds the LSP bin
# for wasm32-wasip1-threads).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"

[features]
dhat-heap = ["mem-profile"]
mem-profile = ["dep:dhat"]
stdio-monitor = []
sampler = ["dep:backtrace", "dep:inferno"]

# The lib tests elaborate the prelude on every test thread (the prelude
# cache is thread-local since the Arc->Rc migration).  Unoptimized debug
# elaboration makes that cost dominate the suite; opt-level=1 (the
# rust-analyzer approach) keeps the suite fast.
[profile.test]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
# strip = true  # enabled for releases, disabled via release-profiling for profiling

[profile.release-profiling]
inherits = "release"
debug = 2
